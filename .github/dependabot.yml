version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Commander 15 requires Node 22; runtime Node 20 remains supported.
    ignore:
      - dependency-name: commander
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
